# World-level starting state: organizations, treaties, wars, sanctions, relations, trade, markets.
# Approximate values as of January 1, 2026 — see manifest notes.

organizations:
  - id: NATO
    name: North Atlantic Treaty Organization
    short: NATO
    members: [USA, GBR, FRA, DEU, POL, LTU, TUR]
    kind: military_alliance
    decisionRule: consensus
    collectiveDefense: true
    applicants: [UKR]
    description: "Collective defense alliance (Article 5). Non-simulated members are abstracted."
  - id: EU
    name: European Union
    short: EU
    members: [DEU, FRA, POL, LTU]
    kind: economic_union
    decisionRule: unanimity
    applicants: [UKR, TUR]
    description: "Single market and customs union; trade policy is an exclusive EU competence; sanctions require unanimity."
  - id: UNSC
    name: UN Security Council
    short: UNSC
    members: [USA, GBR, FRA, RUS, CHN]
    kind: security_council
    decisionRule: p5_veto
    vetoMembers: [USA, GBR, FRA, RUS, CHN]
    description: "Permanent members only are simulated; elected members are abstracted."
  - id: CSTO
    name: Collective Security Treaty Organization
    short: CSTO
    members: [RUS, BLR]
    kind: military_alliance
    decisionRule: consensus
    collectiveDefense: true
    description: "Russia-led security bloc (Central Asian members abstracted)."
  - id: SCO
    name: Shanghai Cooperation Organisation
    short: SCO
    members: [CHN, RUS, BLR]
    kind: partnership
    decisionRule: consensus
    description: "Eurasian political, economic and security forum."

agreements:
  - { id: union-state, name: "Union State security guarantees treaty", parties: [RUS, BLR], signed: "2024-12", clauses: [{ type: MutualDefense }, { type: ForcePresence, from: BLR, to: RUS, text: "Russian forces and non-strategic nuclear weapons stationed in Belarus" }] }
  - { id: rus-chn-treaty, name: "Russia–China Treaty of Good-Neighbourliness", parties: [RUS, CHN], signed: "2001-07", clauses: [{ type: NonAggression }, { type: Custom, text: "'No-limits' strategic partnership" }] }
  - { id: usa-pol-edca, name: "US–Poland Enhanced Defense Cooperation Agreement", parties: [USA, POL], signed: "2020-08", clauses: [{ type: ForcePresence, from: POL, to: USA, text: "US forces stationed in Poland" }] }
  - { id: deu-ltu-brigade, name: "German–Lithuanian brigade agreement", parties: [DEU, LTU], signed: "2023-12", clauses: [{ type: ForcePresence, from: LTU, to: DEU, text: "Permanent German brigade in Lithuania by 2027" }] }
  - { id: gbr-ukr-100y, name: "UK–Ukraine 100-Year Partnership", parties: [GBR, UKR], signed: "2025-01", clauses: [{ type: MilitaryAid, from: GBR, to: UKR, amount: 0.35, months: 12, text: "Annual military support" }, { type: Custom, text: "Long-term security, energy and science cooperation" }] }
  - { id: deu-ukr-support, name: "German–Ukrainian security agreement", parties: [DEU, UKR], signed: "2024-02", clauses: [{ type: MilitaryAid, from: DEU, to: UKR, amount: 0.75, months: 12 }, { type: Payment, from: DEU, to: UKR, amount: 0.5, months: 12, text: "Share of EU budget support (Ukraine Facility / ERA loans)" }] }
  - { id: fra-ukr-support, name: "French–Ukrainian security agreement", parties: [FRA, UKR], signed: "2024-02", clauses: [{ type: MilitaryAid, from: FRA, to: UKR, amount: 0.15, months: 12 }, { type: Payment, from: FRA, to: UKR, amount: 0.35, months: 12, text: "Share of EU budget support" }] }
  - { id: pol-ukr-support, name: "Polish–Ukrainian security agreement", parties: [POL, UKR], signed: "2024-07", clauses: [{ type: MilitaryAid, from: POL, to: UKR, amount: 0.05, months: 12 }, { type: Payment, from: POL, to: UKR, amount: 0.1, months: 12, text: "Share of EU budget support" }] }
  - { id: ltu-ukr-support, name: "Lithuanian–Ukrainian security agreement", parties: [LTU, UKR], signed: "2024-07", clauses: [{ type: MilitaryAid, from: LTU, to: UKR, amount: 0.02, months: 12 }] }
  - { id: row-ukr-support, name: "International support for Ukraine (non-simulated donors, IMF, G7 ERA loans)", parties: [ROW, UKR], signed: "2025-01", clauses: [{ type: Payment, from: ROW, to: UKR, amount: 1.5, months: 12 }, { type: MilitaryAid, from: ROW, to: UKR, amount: 0.6, months: 12, text: "Nordic, Dutch, Canadian aid and PURL purchases of US weapons" }] }
  - { id: usa-ukr-minerals, name: "US–Ukraine Reconstruction Investment Fund", parties: [USA, UKR], signed: "2025-04", clauses: [{ type: Custom, text: "Joint fund for Ukrainian mineral and energy projects" }] }

wars:
  - id: war-rus-ukr
    name: Russo-Ukrainian War
    attackers: [RUS]
    defenders: [UKR]
    start: "2022-02"
    warSupport: { RUS: 62, UKR: 72 }
    casualties: { RUS: 1100000, UKR: 450000 }
    goals:
      RUS: "Capture all of Donetsk, Luhansk, Zaporizhzhia and Kherson oblasts; force Ukrainian neutrality"
      UKR: "Restore territorial integrity; secure lasting security guarantees"
    baseIntensity: 0.45

operations:
  - { id: op-rus-donetsk, country: RUS, warId: war-rus-ukr, type: offensive, units: [RUS-GF-CEN, RUS-GF-SOU], objectives: [UKR-DONETSK], intensity: full, axisNote: "Pokrovsk–Kostiantynivka toward Kramatorsk–Sloviansk" }
  - { id: op-rus-zaporizhzhia, country: RUS, warId: war-rus-ukr, type: offensive, units: [RUS-GF-EAS], objectives: [UKR-ZAPORIZHZHIA], intensity: limited, axisNote: "Huliaipole–Orikhiv" }
  - { id: op-rus-kharkiv, country: RUS, warId: war-rus-ukr, type: offensive, units: [RUS-GF-WES], objectives: [UKR-KHARKIV], intensity: probing, axisNote: "Kupiansk" }
  - { id: op-rus-strikes, country: RUS, warId: war-rus-ukr, type: strategic_strikes, objectives: [UKR-KYIV-CITY, UKR-KHARKIV, UKR-ODESA, UKR-DNIPROPETROVSK, UKR-LVIV], intensity: full, axisNote: "Winter campaign against the power grid" }
  - { id: op-ukr-strikes, country: UKR, warId: war-rus-ukr, type: strategic_strikes, objectives: [RUS-VOLGA, RUS-KRASNODAR, RUS-ROSTOV, RUS-BELGOROD], intensity: limited, axisNote: "Long-range drone strikes on oil refineries and logistics" }

